services:
  mongo:
    image: mongo:8
    container_name: pikafit-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Usuario root de MongoDB}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Contraseña root de MongoDB}
      MONGO_INITDB_DATABASE: ${MONGO_DB:?Nombre de la base de datos}
      MONGO_DB: ${MONGO_DB:?Nombre de la base de datos}
      ADMIN_DB_USER: ${ADMIN_DB_USER:?Usuario BD de Django}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?Contraseña BD de Django}
      USUARIO_DB_USER: ${USUARIO_DB_USER:?Usuario BD de Spring Boot}
      USUARIO_DB_PASSWORD: ${USUARIO_DB_PASSWORD:?Contraseña BD de Spring Boot}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./database/mongo/init.js:/docker-entrypoint-initdb.d/01-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - plataforma-net

  admin-back:
    profiles: ["apps"]
    build: ./Administracion/back
    container_name: pikafit-admin-back
    restart: unless-stopped
    environment:
      # --- Base de datos
      MONGO_URI: mongodb://${ADMIN_DB_USER:?Usuario BD de Django}:${ADMIN_DB_PASSWORD:?Contraseña BD de Django}@mongo:27017/${MONGO_DB:?Nombre de la base de datos}?authSource=${MONGO_DB:?Nombre de la base de datos}
      MONGO_DB: ${MONGO_DB:?Nombre de la base de datos}
      # --- Django
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Clave secreta de Django}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Hosts permitidos de Django}
      CORS_ALLOWED_ORIGINS: ${ADMIN_FRONT_URL:?URL del front de Administración}
      ADMIN_FRONT_URL: ${ADMIN_FRONT_URL:?URL del front de Administración}
      # --- Sesiones (JWT) y recuperación de contraseña
      DJANGO_JWT_SECRET: ${DJANGO_JWT_SECRET:?Clave de firma JWT}
      JWT_ACCESO_MINUTOS: ${JWT_ACCESO_MINUTOS:?Duración del token de acceso}
      JWT_RENOVACION_DIAS: ${JWT_RENOVACION_DIAS:?Duración del token de renovación}
      RECUPERACION_MINUTOS: ${RECUPERACION_MINUTOS:?Vigencia del enlace de recuperación}
      # --- Correo (EMAIL_HOST..EMAIL_USE_TLS solo se usan con EMAIL_MODO=smtp)
      EMAIL_MODO: ${EMAIL_MODO:?Modo de correo (consola o smtp)}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?Remitente de los correos}
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - plataforma-net

  usuario-back:
    profiles: ["apps"]
    build: ./Usuario/back
    container_name: pikafit-usuario-back
    restart: unless-stopped
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${USUARIO_DB_USER:?Usuario BD de Spring Boot}:${USUARIO_DB_PASSWORD:?Contraseña BD de Spring Boot}@mongo:27017/${MONGO_DB:?Nombre de la base de datos}?authSource=${MONGO_DB:?Nombre de la base de datos}
      SERVER_ADDRESS: 0.0.0.0
      CORS_ALLOWED_ORIGINS: ${USUARIO_FRONT_URL:?URL del front de Usuario}
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - plataforma-net

  admin-front:
    profiles: ["apps"]
    build:
      context: ./Administracion/front-web
      args:
        VITE_API_URL: ${ADMIN_API_URL:?URL de la API de Administración}
    container_name: pikafit-admin-front
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - admin-back
    networks:
      - plataforma-net

  usuario-front:
    profiles: ["apps"]
    build:
      context: ./Usuario/front-web
      args:
        VITE_API_URL: ${USUARIO_API_URL:?URL de la API de Usuario}
    container_name: pikafit-usuario-front
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - usuario-back
    networks:
      - plataforma-net

volumes:
  mongo_data:

networks:
  plataforma-net: